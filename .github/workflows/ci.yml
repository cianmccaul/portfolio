# Builds the site, runs the checks and regenerates the CV PDF.
#
# The PDF is printed from the built /cv/ page, so it can never disagree with
# the site. Vercel builds the site from git and can't run a browser, so the
# PDF is committed to public/: on main this workflow commits a fresh copy
# whenever the CV's text has changed, and Vercel then deploys it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "Last updated" reads the last commit date

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The runner image already has the system libraries Chromium needs, so
      # this only downloads the browser. (--with-deps also runs apt, which has
      # stalled the job for ten minutes.) Cached by Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: npx playwright install --only-shell chromium

      - name: Generate and check the CV PDF
        run: npm run cv

      - uses: actions/upload-artifact@v4
        if: always() # keep the PDF even when its checks fail, to see why
        with:
          name: cv
          path: public/*-CV.pdf

      # PDF bytes change on every run (timestamps), so compare the text.
      - name: Commit the PDF if the CV changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pdf=$(ls public/*-CV.pdf)
          new=$(node scripts/pdf-text.mjs "$pdf")
          if git show "HEAD:$pdf" > /tmp/previous.pdf 2>/dev/null; then
            old=$(node scripts/pdf-text.mjs /tmp/previous.pdf)
          else
            old=""
          fi
          if [ "$new" = "$old" ]; then
            git checkout -- "$pdf"
            echo "CV text unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$pdf"
          git commit -m "Regenerate the CV PDF"
          git push
